apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portfolio
  namespace: portfolio
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: portfolio
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 3000
          protocol: TCP
  egress: []
