apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-knowledge
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/AimAmit/infra.git'
    path: cluster/agent-knowledge
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: agent-knowledge
  syncPolicy:
    automated:
      # The PVC opts out of prune individually (Prune=false); everything else
      # here is reconstructible from this repo.
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
