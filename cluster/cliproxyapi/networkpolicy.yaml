apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cliproxyapi-ingress
spec:
  podSelector:
    matchLabels:
      app: cliproxyapi
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hermes
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cliproxyapi
      ports:
        - protocol: TCP
          port: 8317
