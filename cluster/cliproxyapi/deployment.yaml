apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliproxyapi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cliproxyapi
  template:
    metadata:
      labels:
        app: cliproxyapi
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-config
          image: eceasy/cli-proxy-api:v8.0.4@sha256:72205ea2dff7e3e3ef23b03de4e17b169ff7449c02b12f2924a3d4d3eee68b7d
          command: ["/bin/sh", "-ec"]
          args:
            # Management UI owns the writable config after initial seeding.
            - 'mkdir -p /data/auth /data/static /data/cpa-manager-plus; if [ ! -f /data/config.yaml ]; then cp /seed/config.yaml /data/config.yaml; chmod 600 /data/config.yaml; fi'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: seed
              mountPath: /seed
              readOnly: true
        - name: seed-cpamp-static
          image: seakee/cpa-manager-plus:v1.14.10
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p /tmp/seed /data/static
              /usr/local/bin/cpa-manager-plus &
              PID=$!
              for i in $(seq 1 30); do
                if wget -qO /data/static/management.html http://127.0.0.1:18317/management.html 2>/dev/null; then
                  chmod 644 /data/static/management.html
                  kill -9 $PID 2>/dev/null || true
                  exit 0
                fi
                sleep 0.2
              done
              kill -9 $PID 2>/dev/null || true
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: HTTP_ADDR
              value: 127.0.0.1:18317
            - name: USAGE_DATA_DIR
              value: /tmp/seed
            - name: USAGE_DB_PATH
              value: /tmp/seed/usage.sqlite
            - name: CPA_MANAGER_DATA_KEY_PATH
              value: /tmp/seed/data.key
            - name: CPA_MANAGER_ADMIN_KEY
              value: seed-admin-key
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      containers:
        - name: cliproxyapi
          image: eceasy/cli-proxy-api:v8.0.4@sha256:72205ea2dff7e3e3ef23b03de4e17b169ff7449c02b12f2924a3d4d3eee68b7d
          command: ["/CLIProxyAPI/CLIProxyAPI"]
          args: ["-config", "/data/config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8317
          env:
            - name: HOME
              value: /data
            - name: MANAGEMENT_STATIC_PATH
              value: /data/static
            - name: MANAGEMENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cliproxyapi-bootstrap
                  key: management-password
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /CLIProxyAPI/logs
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
        - name: cpa-manager-plus
          image: seakee/cpa-manager-plus:v1.14.10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: manager
              containerPort: 18317
          env:
            - name: HTTP_ADDR
              value: "0.0.0.0:18317"
            - name: CPA_UPSTREAM_URL
              value: "http://127.0.0.1:8317"
            - name: CPA_MANAGEMENT_KEY
              valueFrom:
                secretKeyRef:
                  name: cliproxyapi-bootstrap
                  key: management-password
            - name: CPA_MANAGER_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: cliproxyapi-bootstrap
                  key: management-password
            - name: USAGE_DATA_DIR
              value: /data/cpa-manager-plus
            - name: USAGE_DB_PATH
              value: /data/cpa-manager-plus/usage.sqlite
            - name: CPA_MANAGER_DATA_KEY_PATH
              value: /data/cpa-manager-plus/data.key
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet: {path: /management.html, port: manager}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /management.html, port: manager}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /management.html, port: manager}
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cliproxyapi-data
        - name: seed
          secret:
            secretName: cliproxyapi-bootstrap
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
