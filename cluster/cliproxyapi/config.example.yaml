config-version: 8
server:
  host: ""
  port: 8317
management:
  allow-remote: true
  disable-auto-update-panel: true
access:
  api-keys: ["REPLACE_CLIENT_KEY"]
oauth:
  auth-dir: /data/auth
  providers:
    aistudio:
      ws-auth: true
routing:
  strategy: round-robin
  session-affinity: true
  session-affinity-subagents: true
  force-model-prefix: false
  retry:
    request-retry: 1
requests:
  streaming:
    keepalive-seconds: 15
observability:
  logs:
    logging-to-file: false
    request-log: false
plugins:
  enabled: false
