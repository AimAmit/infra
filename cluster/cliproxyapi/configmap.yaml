apiVersion: v1
kind: ConfigMap
metadata:
  name: cliproxyapi-gateway-config
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        client_max_body_size 50M;
        port_in_redirect off;
        absolute_redirect off;

        # Inference, models & gateway core endpoints -> CLIProxyAPI (8317)
        location ~ ^/(v1|models|healthz|oauth-callback|.*callback|ws) {
            proxy_pass http://127.0.0.1:8317;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Root redirect directly to management dashboard
        location = / {
            return 302 /management.html;
        }

        # Dashboard UI, Usage Analytics, Request Monitoring, and Management -> CPA Manager Plus (18317)
        location / {
            proxy_pass http://127.0.0.1:18317;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
