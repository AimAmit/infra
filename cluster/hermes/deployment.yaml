apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: hermes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      initContainers:
      # hermes gives an MCP server 3 connection attempts at startup and then
      # PARKS it for the life of the process - no periodic retry. Losing the
      # startup race against obsidian-mcp therefore costs a full gateway
      # restart, which is exactly what happened on first deploy.
      #
      # Bounded on purpose: it waits up to 60s and then starts anyway. hermes
      # is a general agent and must not be held hostage by the vault being
      # down - degraded beats absent.
      - name: wait-for-obsidian-mcp
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          for i in $(seq 30); do
            nc -z obsidian-mcp.agent-knowledge.svc.cluster.local 8080 && exit 0
            sleep 2
          done
          echo "obsidian-mcp not reachable after 60s; starting anyway (vault tools will be parked)"
      - name: init-config
        image: alpine:latest
        command:
        - sh
        - -c
        - |
          cp /tmp/config.yaml /opt/data/config.yaml
          mkdir -p /opt/hermes/ssh
          cp /tmp/ssh/id_ed25519 /opt/hermes/ssh/id_ed25519
          chown 10000:10000 /opt/hermes/ssh/id_ed25519
          chmod 400 /opt/hermes/ssh/id_ed25519
        volumeMounts:
        - name: config-volume
          mountPath: /tmp/config.yaml
          subPath: config.yaml
        - name: data-volume
          mountPath: /opt/data
        - name: ssh-key-secret
          mountPath: /tmp/ssh
        - name: ssh-dir
          mountPath: /opt/hermes/ssh
      containers:
      - name: hermes
        image: nousresearch/hermes-agent:latest
        command: ["hermes", "gateway", "run"]
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: codex-lb-token
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: telegram-token
        - name: OBSIDIAN_MCP_TOKEN
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: obsidian-mcp-token
        volumeMounts:
        - name: data-volume
          mountPath: /opt/data
        - name: ssh-dir
          mountPath: /opt/hermes/ssh
      - name: dashboard
        image: nousresearch/hermes-agent:latest
        command: ["hermes", "dashboard"]
        env:
        - name: GATEWAY_HEALTH_URL
          value: "http://localhost:8642"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: codex-lb-token
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: telegram-token
        - name: OBSIDIAN_MCP_TOKEN
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: obsidian-mcp-token
        volumeMounts:
        - name: data-volume
          mountPath: /opt/data

      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: hermes-data
      - name: config-volume
        configMap:
          name: hermes-config
      - name: ssh-key-secret
        secret:
          secretName: hermes-ssh-key
          defaultMode: 256
      - name: ssh-dir
        emptyDir: {}
