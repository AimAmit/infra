# NOT THE LIVE DEFINITION. root-app syncs bootstrap/apps, so the Application
# that actually runs is bootstrap/apps/hermes.yaml, and root-app will revert
# anything set only here. This copy is unreferenced - kustomization.yaml does
# not list it either. Edit bootstrap/apps/hermes.yaml instead.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes-agent
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/AimAmit/infra.git'
    path: cluster/hermes
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: hermes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
