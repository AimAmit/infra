providers:
  codex-lb:
    name: codex-lb
    api: http://codex-lb.codex-lb.svc.cluster.local/v1
    key_env: OPENAI_API_KEY
    transport: chat_completions
    # Hermes does not infer reasoning support for this private service host.
    extra_body:
      reasoning:
        effort: max
model:
  provider: custom:codex-lb
  # codex-lb over in-cluster DNS, so this never leaves the cluster and
  # never traverses the tailnet. Non-local from codex-lb's perspective,
  # so it requires API Key Auth to be enabled there.
  base_url: http://codex-lb.codex-lb.svc.cluster.local/v1
  model: gpt-6-luna
  context_length: 500000
auxiliary:
  vision:
    # Reuse Luna through the in-cluster proxy. The proxy key is not a direct
    # api.openai.com key, so the endpoint must be explicit for vision calls.
    provider: main
    model: ""
    base_url: http://codex-lb.codex-lb.svc.cluster.local/v1
agent:
  reasoning_effort: max
telegram:
  enabled: true
  dmPolicy: pairing
  groupPolicy: allowlist
  streamMode: partial
terminal:
  backend: ssh
  ssh_host: mac-ssh
  ssh_user: tnluser
  ssh_key: /opt/hermes/ssh/id_ed25519
browser:
  cdp_url: ws://browserless.browserless.svc.cluster.local:3000/
mcp_servers:
  # The vault. Cluster-internal DNS only - no tailnet name, no ingress - so
  # this stays reachable with the Mac asleep, which was the whole point.
  # The service admits the hermes namespace and nothing else.
  obsidian:
    transport: http
    url: http://obsidian-mcp.agent-knowledge.svc.cluster.local:8080/mcp
    headers:
      Authorization: "Bearer ${OBSIDIAN_MCP_TOKEN}"
  local-control:
    command: ssh
    args:
      - -i
      - /opt/hermes/ssh/id_ed25519
      - -o
      - StrictHostKeyChecking=no
      - -T
      - tnluser@mac-ssh
      - bunx
      - terminal-mcp
