apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
  - pvc.yaml
  - tailscale-service.yaml
  - deployment.yaml
# Config hash changes force a rollout so the PVC copy receives new settings.
configMapGenerator:
  - name: hermes-config
    files:
      - config.yaml
